apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-producer
  labels:
    app.kubernetes.io/name: fraud-detection
    app.kubernetes.io/component: producer
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.producer.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: fraud-detection
      app.kubernetes.io/component: producer
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraud-detection
        app.kubernetes.io/component: producer
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: producer
          image: "{{ .Values.producer.image.repository }}:{{ .Values.producer.image.tag }}"
          imagePullPolicy: {{ .Values.producer.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: KAFKA_BOOTSTRAP
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: KAFKA_BOOTSTRAP
            - name: TOPIC_TRANSACTIONS
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: TOPIC_TRANSACTIONS
            - name: RATE_PER_SEC
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: RATE_PER_SEC
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -f python > /dev/null 2>&1 || kill -0 1 2>/dev/null || exit 1"
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -f python > /dev/null 2>&1 || kill -0 1 2>/dev/null || exit 1"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.producer.resources | nindent 12 }}
