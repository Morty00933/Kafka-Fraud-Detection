{{- if .Values.redpanda.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-redpanda
  labels:
    app.kubernetes.io/name: fraud-detection
    app.kubernetes.io/component: redpanda
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}-redpanda
  replicas: {{ .Values.redpanda.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: fraud-detection
      app.kubernetes.io/component: redpanda
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraud-detection
        app.kubernetes.io/component: redpanda
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: 101
      containers:
        - name: redpanda
          image: "{{ .Values.redpanda.image.repository }}:{{ .Values.redpanda.image.tag }}"
          imagePullPolicy: {{ .Values.redpanda.image.pullPolicy }}
          # Use args (not command) to preserve the entrypoint script
          # which calls: /usr/bin/rpk $@
          args:
            - redpanda
            - start
            - --kafka-addr
            - 0.0.0.0:{{ .Values.redpanda.ports.kafka }}
            - --advertise-kafka-addr
            - {{ .Release.Name }}-redpanda:{{ .Values.redpanda.ports.kafka }}
            - --pandaproxy-addr
            - 0.0.0.0:{{ .Values.redpanda.ports.pandaproxy }}
            - --advertise-pandaproxy-addr
            - {{ .Release.Name }}-redpanda:{{ .Values.redpanda.ports.pandaproxy }}
            - --rpc-addr
            - 0.0.0.0:{{ .Values.redpanda.ports.rpc }}
            - --advertise-rpc-addr
            - {{ .Release.Name }}-redpanda:{{ .Values.redpanda.ports.rpc }}
            - --mode
            - dev-container
            - --check=false
          ports:
            - name: kafka
              containerPort: {{ .Values.redpanda.ports.kafka }}
              protocol: TCP
            - name: admin
              containerPort: {{ .Values.redpanda.ports.admin }}
              protocol: TCP
            - name: pandaproxy
              containerPort: {{ .Values.redpanda.ports.pandaproxy }}
              protocol: TCP
            - name: rpc
              containerPort: {{ .Values.redpanda.ports.rpc }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          resources:
            {{- toYaml .Values.redpanda.resources | nindent 12 }}
          volumeMounts:
            - name: redpanda-data
              mountPath: /var/lib/redpanda/data
      volumes:
        - name: redpanda-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-redpanda-data
{{- end }}
