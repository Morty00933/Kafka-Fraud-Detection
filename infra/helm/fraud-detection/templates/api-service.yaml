apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: fraud-detection
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.api.ports.http }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: fraud-detection
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: {{ .Release.Name }}
